<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Volante al Hilo{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #5E0C0E;
            --primary-dark: #4a0a0b;
            --white: #ffffff;
            --bg: #f7f7f8;
            --border: #e2e2e5;
            --text: #111111;
            --text-muted: #767680;
            --text-light: #a0a0aa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: var(--primary);
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-brand {
            color: var(--white);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
        }

        .page {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 16px 96px;
        }

        .week-block {
            margin-bottom: 32px;
        }

        .week-title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 0 4px 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }

        .day-group {
            margin-top: 16px;
        }

        .day-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .turno-row {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .turno-time {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: -0.01em;
            min-width: 44px;
            flex-shrink: 0;
        }

        .turno-sep {
            width: 1px;
            height: 32px;
            background: var(--border);
            flex-shrink: 0;
        }

        .turno-body {
            flex: 1;
            min-width: 0;
        }

        .turno-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .turno-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.04em;
            padding: 2px 7px;
            border-radius: 3px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            background: var(--bg);
        }

        .badge-red {
            color: var(--primary);
            background: #fef2f2;
            border-color: #fecaca;
        }

        .badge-green {
            color: #166534;
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .turno-status {
            flex-shrink: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }

        .turno-status.done {
            background: #22c55e;
        }

        .turno-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: var(--white);
            text-decoration: none;
            color: var(--text-muted);
            font-size: 13px;
            transition: all 0.15s;
        }

        .action-btn:hover {
            background: var(--bg);
            color: var(--text);
        }

        .action-btn.del:hover {
            background: #fef2f2;
            border-color: #fecaca;
            color: var(--primary);
        }

        .fab {
            position: fixed;
            bottom: 24px;
            right: 20px;
            height: 48px;
            padding: 0 22px;
            background: var(--primary);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(94, 12, 14, 0.30);
            transition: background 0.15s;
            z-index: 49;
        }

        .fab:hover {
            background: var(--primary-dark);
        }

        .form-wrap {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .form-header {
            background: var(--primary);
            padding: 16px 20px;
        }

        .form-header h1 {
            color: var(--white);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .form-body {
            padding: 20px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .field input,
        .field select {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text);
            background: var(--white);
            outline: none;
            transition: border-color 0.15s;
            -webkit-appearance: none;
            appearance: none;
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--primary);
        }

        .field-check {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 42px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
        }

        .field-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .field-check span {
            font-size: 13px;
            color: var(--text);
        }

        .errorlist {
            list-style: none;
            margin-top: 4px;
        }

        .errorlist li {
            font-size: 11px;
            color: var(--primary);
            font-weight: 500;
        }

        .form-errors {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 5px;
            padding: 10px 14px;
            margin-bottom: 16px;
        }

        .form-errors li {
            font-size: 12px;
            color: var(--primary);
            font-weight: 500;
            list-style: none;
        }

        .btn-submit {
            width: 100%;
            height: 44px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 5px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 42px;
            margin-top: 10px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 5px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-back:hover {
            color: var(--text);
            border-color: #aaa;
        }

        .delete-wrap {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .delete-header {
            background: var(--primary);
            padding: 16px 20px;
        }

        .delete-header h1 {
            color: var(--white);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .delete-body {
            padding: 28px 20px 20px;
            text-align: center;
        }

        .delete-body p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-confirm {
            width: 100%;
            height: 44px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 5px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-confirm:hover {
            background: var(--primary-dark);
        }

        .empty {
            text-align: center;
            padding: 64px 20px;
            color: var(--text-light);
        }

        .empty p {
            font-size: 13px;
            margin-top: 8px;
        }

        .status-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--white);
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .status-btn:hover {
            border-color: #22c55e;
            background: #f0fdf4;
        }

        .status-btn.done {
            background: #22c55e;
            border-color: #22c55e;
        }

        .status-btn.done:hover {
            background: #16a34a;
            border-color: #16a34a;
        }

        /* estilos de total del dia y de la semana*/
        .total-dia {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-align: right;
            padding: 6px 4px 2px;
            letter-spacing: 0.04em;
        }

        .total-semana {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            text-align: right;
            padding: 8px 4px 0;
            border-top: 1px solid var(--border);
            margin-top: 6px;
            letter-spacing: 0.04em;
        }

        /* Estilos dashboard,estadisticas */
        .stat-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
        }

        .filtro-btn {
            padding: 6px 14px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: var(--white);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-muted);
            transition: all 0.15s;
        }

        .filtro-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filtro-btn.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }
    </style>
</head>

<body>
   <header>
    <a href="{% url 'lista_turnos' %}" class="header-brand">Volante al Hilo</a>
    <div style="display:flex;gap:16px;">
        <a href="{% url 'stock' %}" style="color:rgba(255,255,255,0.75);font-size:12px;font-weight:500;text-decoration:none;letter-spacing:0.06em;">Stock</a>
        <a href="{% url 'historial' %}" style="color:rgba(255,255,255,0.75);font-size:12px;font-weight:500;text-decoration:none;letter-spacing:0.06em;">Historial</a>
    </div>
</header>
    <div class="page">
        {% block contenido %}{% endblock %}
    </div>
    {% block fab %}
    <a href="{% url 'crear_turno' %}" class="fab">+ &nbsp;Nuevo turno</a>
    {% endblock %}
</body>

</html>
