{% extends 'base.html' %}
{% block titulo %}Eliminar turno{% endblock %}
{% block fab %}{% endblock %}

{% block contenido %}
<div class="delete-wrap">
    <div class="delete-header">
        <h1>Eliminar turno</h1>
    </div>
    <div class="delete-body">
        <p>¿Estás seguro que querés eliminar este turno?<br>Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn-confirm">Confirmar eliminación</button>
        </form>
        <a href="{% url 'lista_turnos' %}" class="btn-back">Cancelar</a>
    </div>
</div>
{% endblock %}
